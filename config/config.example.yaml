# IReckon 配置模板：复制为 config/config.yaml 后按需修改。
# config.yaml 含本地实例密钥与自动生成的 API token，不入库（见 .gitignore）；
# 密钥推荐用 ${ENV_VAR} 占位符引用 .env，api_token 留空则首次启动自动生成。
ai_pool:
  default_model: auto
  routing:
    # 执行通道无可用实例时是否回退主通道（会消耗按次计费调用）
    execution_fallback_to_primary: true
  response_cache:
    enabled: true
    ttl_seconds: 3600
    max_entries: 512
  instances:
  - api_key: ${FREELMAPI_KEY}
    cost_per_1k_tokens: 0.0
    enabled: true
    endpoint: http://localhost:3003/v1
    id: freellmapi
    max_context: 131072
    model: auto
    name: FreeLLM API
    parameters: {}
    tags:
    - general
    - cheap
    - fast
    - python
    - code
    - cli
    - testing
    - review
    - architecture
    - web
    - documentation
  - api_key: ${DEEPSEEK_API_KEY}
    cost_per_1k_tokens: 0.28
    enabled: true
    endpoint: https://api.deepseek.com
    id: deepseek-v4-flash
    max_context: 131072
    model: deepseek-v4-flash
    name: DeepSeek V4 Flash
    parameters:
      thinking:
        type: enabled
      reasoning_effort: medium
    tags:
    - general
    - fast
    - cheap
    - code
    - review
    - architecture
    - python
    - channel:execution
  - api_key: ${DEEPSEEK_API_KEY}
    cost_per_1k_tokens: 2.19
    enabled: true
    endpoint: https://api.deepseek.com
    id: deepseek-v4-pro
    max_context: 131072
    model: deepseek-v4-pro
    name: DeepSeek V4 Pro
    parameters:
      thinking:
        type: enabled
      reasoning_effort: high
    tags:
    - general
    - hard
    - code
    - architecture
    - review
  - api_key: ${OPENCODE_API_KEY}
    cost_per_1k_tokens: 0.0
    enabled: true
    endpoint: https://opencode.ai/zen/v1
    id: opencodezen-ox-free
    max_context: 131072
    model: x-preview-f-free
    name: OpenCode Zen Ox Alpha Free
    parameters: {}
    tags:
    - general
    - fast
    - cheap
    - code
    - channel:execution
harness:
  cli_command: npx @deepseek-ai/dsh
  cordis_config: config/harness/minimal.cordis.yml
  enabled: true
  # 安全门：cordis 策略为 danger-full-access 时必须显式置 true 才允许运行
  allow_full_access: false
  # 生成默认 cordis 模板时使用的策略模式
  policy_mode: danger-full-access
  # 任务文本命令过滤（L3 高危构造拦截）开关
  command_filter_enabled: true
  max_tokens: 49152
  model: deepseek-v4-flash
  mode: auto
  provider: deepseek-official
  session_root: ./data/harness/sessions
  timeout_seconds: 600
  workspace_root: ./data/harness/workspaces
learning:
  idle_trigger_minutes: 30
  source_whitelist:
  - https://github.com/trending
persistence:
  max_snapshots_per_task: 20
  snapshot_interval_seconds: 60
security:
  api_token: ""
  code_scanner: bandit
  local_command_levels:
    L1_auto_exec: true
    L2_vote_threshold: 0.5
    L3_block: true
  sandbox:
    cpu_limit: 1.0
    engine: udocker
    image: python:3.11-slim
    memory_limit: 512m
  supply_chain_blacklist:
    npm: []
    pip: []
self_update:
  branch_prefix: self-improve
  check_interval_hours: 24
  enabled: true
  file_blacklist:
  - config/config.yaml
  - data/
  - app/security/
  - app/core/updater.py
  max_files_per_round: 5
  repo: Ameiro-sudo/IReckon
server:
  docs_enabled: false
  frontend_dev_url: http://127.0.0.1:3000
  host: 127.0.0.1
  log_level: INFO
  open_browser: false
  port: 8000
system:
  data_dir: ./data
  log_level: INFO
  name: IReckon
  version: 0.1.0
task_defaults:
  loop_detection_max_rounds: 8
  loop_similarity_threshold: 0.95
  max_review_rounds: 5
  max_task_duration_seconds: 7200
  max_task_tokens_per_task: 1000000
ui:
  default_view: styled
  theme: catgirl
