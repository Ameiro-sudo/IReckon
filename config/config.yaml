ai_pool:
  default_model: auto
  instances:
  - api_key: ${FREELMAPI_KEY}
    cost_per_1k_tokens: 0.0
    enabled: true
    endpoint: http://localhost:3003/v1
    id: freellmapi
    max_context: 131072
    model: auto
    name: FreeLLM API
    parameters: {}
    tags:
    - general
    - cheap
    - fast
    - python
    - code
    - cli
    - testing
    - review
    - architecture
    - web
    - documentation
learning:
  idle_trigger_minutes: 30
  source_whitelist:
  - https://github.com/trending
persistence:
  max_snapshots_per_task: 20
  snapshot_interval_seconds: 60
security:
  code_scanner: bandit
  local_command_levels:
    L1_auto_exec: true
    L2_vote_threshold: 0.5
    L3_block: true
  sandbox:
    cpu_limit: 1.0
    engine: udocker
    image: python:3.11-slim
    memory_limit: 512m
  supply_chain_blacklist:
    npm: []
    pip: []
self_update:
  branch_prefix: self-improve
  check_interval_hours: 24
  enabled: true
  file_blacklist:
  - config/config.yaml
  - data/
  - app/security/
  - app/core/updater.py
  max_files_per_round: 5
  repo: ninasukiwww-png/IReckon
server:
  frontend_dev_url: http://127.0.0.1:3000
  host: 0.0.0.0
  log_level: INFO
  open_browser: false
  port: 8000
system:
  data_dir: ./data
  log_level: INFO
  name: IReckon
  version: 2.1.0
task_defaults:
  loop_detection_max_rounds: 5
  loop_similarity_threshold: 0.9
  max_review_rounds: 5
  max_task_duration_seconds: 7200
  max_task_tokens_per_task: 1000000
ui:
  default_view: styled
  theme: catgirl
