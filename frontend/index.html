<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IReckon — AI Factory</title>
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23151a20'/%3E%3Crect x='1' y='1' width='30' height='30' rx='5' fill='none' stroke='%2333404b' stroke-width='1'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23eda73f'/%3E%3Crect x='10' y='22' width='12' height='3' rx='1.5' fill='%235c6873'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function () {
        var saved = localStorage.getItem('theme')
        var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.setAttribute('data-theme', 'dark')
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
