services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ireckon:latest
    container_name: ireckon
    ports:
      # 默认仅绑定宿主回环：API 带鉴权但不应默认暴露到局域网。
      # 如需局域网访问，改为 "8000:8000" 并确认 IRECKON_API_TOKEN 已固定配置。
      - "127.0.0.1:8000:8000"
    volumes:
      - ./../config:/app/config
      - ireckon-data:/app/data
    environment:
      - IRECKON_HOME=/app
      - IRECKON_API_HOST=0.0.0.0
      - IRECKON_API_PORT=8000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - FREELMAPI_KEY=${FREELMAPI_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  ireckon-data:
