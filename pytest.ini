[pytest]
testpaths = tests
# Skip runtime artifact/venv dirs (data/outputs may contain stale test/conftest files)
norecursedirs = data outputs .git .venv __pycache__ node_modules frontend/node_modules tests/.tmp
# pytest-asyncio: auto mode picks up async tests without explicit marks
asyncio_mode = auto
asyncio_default_test_loop_scope = function
asyncio_default_fixture_loop_scope = function
# Hard timeout: any hanging test fails after 120s (with thread dump)
timeout = 120
timeout_method = thread
addopts = -q --no-header -p no:cacheprovider